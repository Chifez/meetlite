name: MeetLite Change Verifier

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Execute Verification Cage Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci

      - name: Block critical production dependency advisories
        run: |
          npm audit --omit=dev --audit-level=critical
          npm --prefix backend audit --omit=dev --audit-level=critical

      - name: Run Truthful Verifier
        id: verifier
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          HEAD_SHA="${{ github.sha }}"

          npm run verify -- --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Upload Verification Manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          path: |
            verification-manifest.json
            verification-report.md
          retention-days: 14
